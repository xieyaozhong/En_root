<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>EnRoot｜1,061+ 字根地圖</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .atlasHero{padding:28px;margin-bottom:16px}.atlasHero h2{font-size:clamp(32px,6vw,54px);margin:8px 0 10px;letter-spacing:-.04em}.atlasHero p{color:var(--muted);line-height:1.7;max-width:780px}
    .atlasTools{display:grid;grid-template-columns:1fr 180px;gap:10px;margin-top:18px}.atlasTools input,.atlasTools select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#0a1628;color:var(--text);font:inherit}
    .atlasMeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.atlasGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .rootCard{padding:16px}.rootKey{font-size:25px;font-weight:900;color:var(--mint)}.rootType{font-size:11px;color:var(--blue);font-weight:800;letter-spacing:.08em}.rootMeaning{margin:8px 0 10px;line-height:1.6;color:#d8e6f4}.rootExamples{display:flex;gap:6px;flex-wrap:wrap}.rootExamples span{border:1px solid var(--line);border-radius:9px;padding:5px 7px;color:var(--muted);font-size:11px}.atlasEmpty{padding:30px;text-align:center;color:var(--muted)}
    @media(max-width:820px){.atlasGrid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.atlasTools{grid-template-columns:1fr}.atlasGrid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <a class="brand navlink" href="index.html"><div class="logo">ER</div><div><h1>EnRoot</h1><p>Root Atlas</p></div></a>
    <div class="chips"><a class="chip navlink" href="index.html">← 回練習</a><span class="chip" id="atlasCount">載入中</span></div>
  </header>

  <section class="card atlasHero">
    <div class="eyebrow">ETYMOLOGY MAP · 1,061+ ROOTS</div>
    <h2>從一個字根<br>連到一整個詞族</h2>
    <p>整合 1,061 組英文字根、字首與字尾資料。可直接搜尋 root、核心義或例字，適合 TOEIC、TOEFL、GRE 等高階字彙建立結構化記憶。</p>
    <div class="atlasTools">
      <input id="rootSearch" type="search" placeholder="搜尋字根、意思或例字，例如 tract / carry / transport" autocomplete="off">
      <select id="rootType">
        <option value="all">全部類型</option>
        <option value="prefix">PREFIX 字首</option>
        <option value="root">ROOT 字根</option>
        <option value="suffix">SUFFIX 字尾</option>
      </select>
    </div>
    <div class="atlasMeta">
      <span class="chip" id="shownCount">—</span>
      <span class="chip">點例字可直接複製拼字</span>
    </div>
  </section>

  <section id="atlasGrid" class="atlasGrid"></section>
  <div class="footer">字根資料整合自公開 MIT 授權的 generated-english-roots-list。字源拆解用於學習輔助；個別單字的歷史詞源可能比簡化字根模型更複雜。</div>
</main>
<script src="roots.js"></script>
</body>
</html>
